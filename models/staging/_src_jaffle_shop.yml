sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    database: dbt-tutorial
    schema: jaffle_shop
    tables:
      - name: customers 
        description: Raw customers table
        columns: 
          - name: id
            description: primary key
            data_tests: 
              - unique
              - not_null 
      - name: orders
        columns: 
          - name: id 
            data_tests: 
              - unique
              - not_null 
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after: 
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at
  - name: stripe
    database: dbt-tutorial
    tables:
      - name: payment
        config:
            loaded_at_field: _batched_at
            freshness:
              warn_after: {count: 12, period: hour}
              error_after: {count: 24, period: hour}

