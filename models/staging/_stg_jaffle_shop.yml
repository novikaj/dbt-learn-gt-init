models:
  - name: stg_jaffle_shop__customers
    description: Staged customer data from our jaffle shop app
    columns:
      - name: customer_id
        description: The primary key for customers
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: Staged order data
    columns:
      - name: order_id
        description: Primary key for orders
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
      - name: customer_id
        description: Foreign key to stg_customers.customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
  - name: stg_stripe__payments
    description: Staging model with information about order payments statuses
    columns: 
      - name: order_id 
        description: Foreign key to stg_orders.order_id
      - name: payment_method
        description: "{{ doc('payment_method') }}"